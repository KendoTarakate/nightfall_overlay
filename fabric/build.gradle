plugins {
	id 'dev.architectury.loom' version "${loom_version}"
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
	archivesName = rootProject.archives_base_name
}

// Loader-agnostic code (no Minecraft/loader imports) lives at the repo root and
// is compiled into BOTH the Fabric and Forge jars. Because it touches no
// remapped Minecraft classes the produced .class files are byte-identical, so
// the universal jar can dedupe them safely.
sourceSets {
	main {
		java.srcDir "$rootDir/src/shared/java"
	}
}

repositories {
	maven {
		name = 'plasmoverse-releases'
		url = 'https://repo.plasmoverse.com/releases'
	}
	maven {
		name = 'plasmoverse-snapshots'
		url = 'https://repo.plasmoverse.com/snapshots'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"nightfalloverlay" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// A second client so two players can join the same dev server — needed to
		// watch the nickname rename update on another player's tab list and chat.
		// Use it with the "Minecraft Server" run config: start the server, then
		// launch "Minecraft Client" (Player) and "Minecraft Client 2" (Player2)
		// and connect both to localhost.
		client2 {
			inherit client
			name = "Minecraft Client 2"
			runDir = "run/client2"
			programArgs("--username", "Player2")
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

	compileOnly 'su.plo.voice.api:server:2.1.5'
	compileOnly 'su.plo.voice.api:client:2.1.5'

	implementation group: 'com.google.code.gson', name: 'gson', version: '2.7'

	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
}
