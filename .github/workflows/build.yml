# Builds the mod on every push / PR and uploads the jars as artifacts.
# Pushing a version tag (e.g. v1.1.0) additionally publishes a GitHub Release
# with the universal + per-loader jars attached for download.
name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tag pushes

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --stacktrace

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightfalloverlay-jars
          path: |
            build/libs/*.jar
            fabric/build/libs/*.jar
            forge/build/libs/*.jar

      - name: collect release jars
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp build/libs/*-universal.jar release/
          cp fabric/build/libs/nightfalloverlay-*.jar release/
          cp forge/build/libs/nightfalloverlay-forge-*.jar release/
          rm -f release/*-sources.jar
          ls -la release

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
