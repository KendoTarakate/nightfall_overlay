pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'plasmoverse-releases'
			url = 'https://repo.plasmoverse.com/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'nightfalloverlay'

include 'fabric'
include 'forge'