plugins {
	id 'base'
}

version = project.mod_version
group = project.maven_group

// Root is an aggregator. The actual mods live in the :fabric and :forge
// subprojects; loader-agnostic code lives in src/shared/java (compiled into
// both). This task combines the two remapped jars into a single universal jar
// that loads on either loader: Fabric reads fabric.mod.json, Forge reads
// META-INF/mods.toml, and each loader only classloads its own entrypoints, so
// the intermediary-mapped (Fabric) and SRG-mapped (Forge) classes coexist.

// Ensure the subprojects are fully configured first so their loom-created
// `remapJar` tasks exist when referenced below.
evaluationDependsOn(':fabric')
evaluationDependsOn(':forge')

def fabricRemap = project(':fabric').tasks.named('remapJar')
def forgeRemap = project(':forge').tasks.named('remapJar')

tasks.register('mergedJar', Jar) {
	group = 'build'
	description = 'Builds a single jar that runs on both Fabric and Forge.'
	archiveBaseName = project.archives_base_name
	archiveClassifier = 'universal'
	destinationDirectory = layout.buildDirectory.dir('libs')

	dependsOn fabricRemap, forgeRemap
	// Track both remapped jars as inputs so the merge re-runs whenever either
	// changes (a plain closure-based `from` would leave the task UP-TO-DATE and
	// keep a stale output).
	inputs.files(fabricRemap, forgeRemap)

	from(fabricRemap.map { zipTree(it.archiveFile.get().asFile) })
	from(forgeRemap.map { zipTree(it.archiveFile.get().asFile) })

	// The loader-agnostic shared classes (and the default manifest) are present
	// in both inputs and are byte-equivalent, so keep the first copy. Every
	// loader-specific class/metadata file has a disjoint path and is retained.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble').configure {
	dependsOn 'mergedJar'
}
